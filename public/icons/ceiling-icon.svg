<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" fill="none">
  <defs>
    <!-- triangle arrowhead -->
    <marker id="arrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- top bar (capsule style) -->
  <rect x="2" y="2" width="50" height="6" rx="2.5" fill="#F0EEE8" stroke="black" stroke-width="1"/>

  <!-- bottom bar (capsule style) -->
  <rect x="2" y="46" width="50" height="6" rx="2.5" fill="#F0EEE8" stroke="black" stroke-width="1"/>

  <line x1="10" y1="42" x2="10" y2="10" stroke="black" stroke-width="1" marker-start="url(#arrowHead)" marker-end="url(#arrowHead)"/>

  <text x="28" y="27" fill="black" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" dominant-baseline="middle">12 ft</text>
</svg>

