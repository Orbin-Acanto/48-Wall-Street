<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none">
  
  <!-- Main large hall/room -->
  <rect x="10" y="20" width="160" height="160" fill="#E8E6E0" stroke="black" stroke-width="2"/>
  
  <!-- Conference Room 1 (top right) -->
  <rect x="180" y="20" width="50" height="75" fill="#D4D2CA" stroke="black" stroke-width="2"/>
  
  <!-- Conference Room 2 (bottom right) -->
  <rect x="180" y="105" width="50" height="75" fill="#D4D2CA" stroke="black" stroke-width="2"/>
  
  <!-- Breakout Space (left side) -->
  <rect x="10" y="20" width="40" height="50" fill="#D4D2CA" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  
  <!-- Doors with proper swing indicators -->
  <!-- Main entrance door (bottom center) -->
  <line x1="75" y1="180" x2="105" y2="180" stroke="white" stroke-width="3"/>
  <path d="M75 180 Q75 165 90 165" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="75" y1="180" x2="90" y2="165" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Door to Conference Room 1 -->
  <line x1="180" y1="50" x2="180" y2="65" stroke="white" stroke-width="3"/>
  <path d="M180 50 Q165 50 165 65" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="180" y1="50" x2="165" y2="65" stroke="#2C2C2C" stroke-width="1"/>
  
  <!-- Door to Conference Room 2 -->
  <line x1="180" y1="130" x2="180" y2="145" stroke="white" stroke-width="3"/>
  <path d="M180 130 Q165 130 165 145" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="180" y1="130" x2="165" y2="145" stroke="#2C2C2C" stroke-width="1"/>
  
</svg>